name: Collect air quality

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch:         # lets you run it by hand

permissions:
  contents: write
  issues: write

concurrency:
  group: collect

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect data
        env:
          OPENAQ_KEY: ${{ secrets.OPENAQ_KEY }}
        run: python collect.py

      - name: Schema check
        run: python check_data.py

      - name: Heartbeat
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > data/heartbeat.txt

      - name: Save new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M')" || echo "Nothing to commit"
          git pull --rebase
          git push

      - name: Open an issue if anything failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Collector failed on ${new Date().toISOString()}`,
              body: `See the run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });